{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Nueva Contrasena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h1 class="h4 mb-0">Nueva contrasena</h1>
            </div>
            <div class="card-body">
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                {% else %}
                    <p class="mb-0">El enlace no es valido o ya fue usado.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
